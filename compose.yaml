# This docker compose file is for building and running a development version of PoT Against Humanity.
# If you want to deploy a production instance, please see 
# https://github.com/ccomarato/potagainsthumanity/wiki/Deploying for important steps you should take.

networks:
  internal:

services:
  server:
    build: ./server
    image: "potagainsthumanity/server:dev"
    networks:
      - internal
    restart: unless-stopped
  client:
    build: ./client
    image: "potagainsthumanity/client:dev"
    ports:
      - "127.0.0.1:8080:8080/tcp"
    networks:
      - internal
    restart: unless-stopped
