version: '3.8'

networks:
  internal:

services:
  server:
    image: potagainsthumanity/server:latest
    networks:
      - internal
    restart: unless-stopped
    
  client:
    image: potagainsthumanity/client:latest
    ports:
      - "80:8080"
      - "443:8080"
    networks:
      - internal
    restart: unless-stopped
    depends_on:
      - server
